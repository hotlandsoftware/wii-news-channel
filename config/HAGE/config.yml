  - symbol: gGlobeDotAngles
    binary: news/GlobeDotAngles.bin
    header: news/GlobeDotAngles.inc
    header_type: raw
  - symbol: gGlobeDotSizes
    binary: news/GlobeDotSizes.bin
    header: news/GlobeDotSizes.inc
    header_type: raw
  - symbol: gGlobeDotColorIdx
    binary: news/GlobeDotColorIdx.bin
