# See docs/ and https://github.com/encounter/decomp-toolkit for documentation.
# Extract orig/HAGE/sys/main.dol from the WAD with tools/extract_wad.py.
object: orig/HAGE/sys/main.dol
hash: 1bb643fa5f5e11930849b5efd514f08d30ead975
symbols: config/HAGE/symbols.txt
splits: config/HAGE/splits.txt
mw_comment_version: 14
quick_analysis: false
detect_objects: true
detect_strings: true
write_asm: true

# Unreferenced data that the original link kept (vcmv_cursor.cpp, vcmv_draw.cpp)
force_active:
  - vcmvCursorUnused1
  - vcmvCursorUnused2
  - vcmvCursorUnused3
  - vcmvUnusedBss238
  - vcmvUnusedBss2F8

block_relocations:
  # Random table data that happens to look like a pointer into OSFont's HankakuToCode
  - source: 0x801E4C9C
  # Random rodata table bytes that look like a pointer into BTE's gki_cb (.bss)
  - source: 0x8019E9B4
  # Random rodata table bytes that look like pointers into snd's SoundSystem work area (.bss)
  - source: 0x8019E188
  - source: 0x8019F040
  # Random cp932 table bytes that look like a pointer into GlobeDots' angle table
  - source: 0x801A9A30
  # OSInit: lis/addi of 0x80004000 (start of .init)
  - source: 0x800FC6F8
  - source: 0x800FC770

# SystemCalc (System.cpp) spills lis/addi address pairs to the stack, so dtk misses them.
add_relocations:
  - source: 0x8003DD38
    type: ha
    target: gCursorX
  - source: 0x8003DD64
    type: l
    target: gCursorX
